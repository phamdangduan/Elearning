server:
  port: 8080

spring:
  # Secret thật nằm trong application-local.yml (không commit) hoặc biến môi trường.
  # Xem mẫu: application-local.example.yml
  config:
    import: optional:classpath:application-local.yml

  datasource:
    url: jdbc:mysql://localhost:3306/elearning_db1
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000ms

  servlet:
    # Phải >= file.upload.max-video-size, nếu không video bị Spring chặn trước khi tới service
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB

# ===== CLOUDINARY =====
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# ===== FILE UPLOAD =====
file:
  upload:
    max-file-size: 10485760     # ảnh: 10MB
    max-video-size: 104857600   # video: 100MB (giới hạn upload video của Cloudinary gói free)
    allowed-image-types: image/jpeg,image/png,image/jpg,image/webp
    allowed-video-types: video/mp4,video/avi,video/mov,video/wmv,video/x-msvideo,video/quicktime,video/x-matroska,video/webm


# ===== JWT =====
jwt:
  # Min 64 chars (512 bits) for HS512 — set in application-local.yml or env var JWT_SIGNER_KEY
  signer-key: ${JWT_SIGNER_KEY:}
  access-token-expiry: 3600        # 1 hour (seconds)
  refresh-token-expiry: 1209600    # 14 days (seconds)
  issuer: elearning-app

# ===== PAYMENT (Platform Marketplace + SePay Webhook) =====
payment:
  expire-minutes: 15                 # Thời hạn thanh toán của 1 đơn
  reference-prefix: "EDU"            # Prefix mã đối soát — cấu hình trùng prefix trong SePay
  webhook:
    # SePay gửi header: "Authorization: Apikey <api-key>". Đặt trong application-local.yml hoặc env SEPAY_WEBHOOK_API_KEY.
    # Để trống → mọi webhook đều bị từ chối (fail closed).
    api-key: ${SEPAY_WEBHOOK_API_KEY:}
  platform:
    commission-rate: 0.20            # Sàn giữ 20%, giảng viên nhận 80%
    bank-name: "MBBank"
    bank-code: "MB"                  # Mã ngân hàng theo VietQR (img.vietqr.io)
    account-number: "9999999999"
    account-name: "CONG TY ELEARNING EDUVN"
  wallet:
    hold-days: 7                     # Số ngày tạm giữ tiền trước khi được rút (0 = tắt)
    min-withdrawal: 50000            # Số tiền rút tối thiểu (VND)

# ===== LOGGING =====
logging:
  level:
    com.example.Elearning.security: INFO
    com.example.Elearning.service.AuthService: INFO
    org.springframework.security: WARN
