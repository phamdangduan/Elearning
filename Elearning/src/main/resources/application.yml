server:
  port: 8080

spring:
  # Secret thật nằm trong application-local.yml (không commit) hoặc biến môi trường.
  # Xem mẫu: application-local.example.yml
  config:
    import: optional:classpath:application-local.yml

  datasource:
    url: jdbc:mysql://localhost:3306/elearning_db1
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000ms

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# ===== CLOUDINARY =====
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# ===== FILE UPLOAD =====
file:
  upload:
    max-file-size: 10485760
    max-video-size: 524288000
    allowed-image-types: image/jpeg,image/png,image/jpg,image/webp
    allowed-video-types: video/mp4,video/avi,video/mov,video/wmv,video/x-msvideo,video/quicktime,video/x-matroska,video/webm


# ===== JWT =====
jwt:
  # Min 64 chars (512 bits) for HS512 — set in application-local.yml or env var JWT_SIGNER_KEY
  signer-key: ${JWT_SIGNER_KEY:}
  access-token-expiry: 3600        # 1 hour (seconds)
  refresh-token-expiry: 1209600    # 14 days (seconds)
  issuer: elearning-app

# ===== LOGGING =====
logging:
  level:
    com.example.Elearning.security: INFO
    com.example.Elearning.service.AuthService: INFO
    org.springframework.security: WARN
