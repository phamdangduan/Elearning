server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/elearning_db1
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000ms

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# ===== CLOUDINARY =====
cloudinary:
  cloud-name: dfyiboei9
  api-key: 388458427626422
  api-secret: VSBI8cZ2jpqEDVwMb2zxHq7uu3Q

# ===== FILE UPLOAD =====
file:
  upload:
    max-file-size: 10485760
    max-video-size: 524288000
    allowed-image-types: image/jpeg,image/png,image/jpg,image/webp
    allowed-video-types: video/mp4,video/avi,video/mov,video/wmv,video/x-msvideo,video/quicktime,video/x-matroska,video/webm


# ===== JWT =====
jwt:
  # Min 64 chars (512 bits) for HS512 — override via env var JWT_SIGNER_KEY in production
  signer-key: "elearning-super-secret-key-for-hs512-algorithm-must-be-at-least-64-characters-long-2024"
  access-token-expiry: 3600        # 1 hour (seconds)
  refresh-token-expiry: 1209600    # 14 days (seconds)
  issuer: elearning-app

# ===== LOGGING =====
logging:
  level:
    com.example.Elearning.security: INFO
    com.example.Elearning.service.AuthService: INFO
    org.springframework.security: WARN
